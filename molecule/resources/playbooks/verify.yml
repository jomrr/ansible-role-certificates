---
# role: certificates
# file: molecule/resources/playbooks/verify.yml

- name: CERTIFICATES | Verify deployed TLS identities and permissions
  hosts: all
  gather_facts: true
  tasks:
    - name: CERTIFICATES | Read the web TLS identity
      community.crypto.get_certificate:
        host: localhost
        port: 18443
      register: __certificates_test_web

    - name: CERTIFICATES | Read the mail TLS identity
      community.crypto.get_certificate:
        host: localhost
        port: 19443
      register: __certificates_test_mail

    - name: CERTIFICATES | Verify the host-specific certificate assignments
      ansible.builtin.assert:
        that:
          - __certificates_test_web.subject.CN == inventory_hostname ~ '-web'
          - __certificates_test_mail.subject.CN == inventory_hostname ~ '-mail'

    - name: CERTIFICATES | Inspect deployed resources
      become: true
      become_user: root
      ansible.builtin.stat:
        path: "{{ __certificates_test_resource.path }}"
      loop:
        - path: "{{ __certificates_test_certificate_directory }}/18443.crt"
          src: "{{ __certificates_test_source }}/web.pem"
          mode: '0664'
          owner: root
          group: root
        - path: "{{ __certificates_test_certificate_directory }}/18443-chain.pem"
          src: "{{ __certificates_test_source }}/ca.pem"
          mode: '0664'
          owner: root
          group: root
        - path: "{{ __certificates_test_certificate_directory }}/18443-fullchain.pem"
          src: "{{ __certificates_test_source }}/web-fullchain.pem"
          mode: '0644'
          owner: root
          group: root
        - path: "{{ __certificates_test_key_directory }}/18443.key"
          src: "{{ __certificates_test_source }}/web.key"
          mode: '0640'
          owner: root
          group: root
        - path: "{{ __certificates_test_certificate_directory }}/19443.crt"
          src: "{{ __certificates_test_source }}/mail.pem"
          mode: '0640'
          owner: root
          group: root
        - path: "{{ __certificates_test_key_directory }}/19443.key"
          src: "{{ __certificates_test_source }}/mail.key"
          mode: '0640'
          owner: nobody
          group: root
        - path: "{{ __certificates_test_key_directory }}/19443-bundle.pem"
          src: "{{ __certificates_test_source }}/mail-bundle.pem"
          mode: '0600'
          owner: root
          group: root
        - path: "{{ __certificates_test_key_directory }}/auxiliary-bundle.pem"
          src: "{{ __certificates_test_source }}/web-bundle.pem"
          mode: '0640'
          owner: root
          group: root
      loop_control:
        loop_var: __certificates_test_resource
        label: "{{ __certificates_test_resource.path }}"
      register: __certificates_test_stats

    - name: CERTIFICATES | Inspect the corresponding source artifacts
      become: true
      become_user: root
      ansible.builtin.stat:
        path: "{{ __certificates_test_installed.__certificates_test_resource.src }}"
      delegate_to: "{{ certificates_source_host }}"
      loop: "{{ __certificates_test_stats.results }}"
      loop_control:
        loop_var: __certificates_test_installed
        label: "{{ __certificates_test_installed.stat.path }}"
      register: __certificates_test_source_stats

    - name: CERTIFICATES | Verify installed artifact contents match their sources
      ansible.builtin.assert:
        that: __certificates_test_source_stat.stat.checksum ==
          __certificates_test_source_stat.__certificates_test_installed.stat.checksum
      loop: "{{ __certificates_test_source_stats.results }}"
      loop_control:
        loop_var: __certificates_test_source_stat
        label: "{{ __certificates_test_source_stat.stat.path }}"

    - name: CERTIFICATES | Verify installed access permissions
      ansible.builtin.assert:
        that:
          - __certificates_test_stat.stat.mode == __certificates_test_stat.__certificates_test_resource.mode
          - __certificates_test_stat.stat.pw_name == __certificates_test_stat.__certificates_test_resource.owner
          - __certificates_test_stat.stat.gr_name == __certificates_test_stat.__certificates_test_resource.group
      loop: "{{ __certificates_test_stats.results }}"
      loop_control:
        loop_var: __certificates_test_stat
        label: "{{ __certificates_test_stat.stat.path }}"

    - name: CERTIFICATES | Read numeric access ACLs
      become: true
      become_user: root
      ansible.builtin.command:
        argv:
          - getfacl
          - --absolute-names
          - --omit-header
          - --numeric
          - "{{ __certificates_test_acl.path }}"
      changed_when: false
      loop:
        - path: "{{ __certificates_test_certificate_directory }}/18443.crt"
          entries: ['user:65534:rw-']
        - path: "{{ __certificates_test_certificate_directory }}/18443-chain.pem"
          entries: ['group:60027:rw-']
        - path: "{{ __certificates_test_certificate_directory }}/18443-fullchain.pem"
          entries: ['user:60026:r--']
        - path: "{{ __certificates_test_key_directory }}/18443.key"
          entries: ['user::rw-', 'user:26:r--', 'user:60026:r--', 'group::---', 'group:60027:r--', 'mask::r--', 'other::---']
        - path: "{{ __certificates_test_key_directory }}/auxiliary-bundle.pem"
          entries: ['user:60026:r--', 'group::---']
      loop_control:
        loop_var: __certificates_test_acl
        label: "{{ __certificates_test_acl.path }}"
      register: __certificates_test_acl_state

    - name: CERTIFICATES | Verify configured artifact ACLs
      ansible.builtin.assert:
        that: >-
          __certificates_test_acl_result.__certificates_test_acl.entries
          | difference(__certificates_test_acl_result.stdout_lines) | length == 0
        quiet: true
      loop: "{{ __certificates_test_acl_state.results }}"
      loop_control:
        loop_var: __certificates_test_acl_result
        label: "{{ __certificates_test_acl_result.__certificates_test_acl.path }}"

    - name: CERTIFICATES | Inspect service symlinks
      ansible.builtin.stat:
        path: "{{ __certificates_test_link.path }}"
        follow: false
      loop:
        - path: /tmp/certificates-service/tls/50-site.crt
          target: "{{ __certificates_test_certificate_directory }}/18443-fullchain.pem"
        - path: /tmp/certificates-service/tls/50-site.key
          target: "{{ __certificates_test_key_directory }}/18443.key"
        - path: /tmp/certificates-service/tls/proxy.pem
          target: "{{ __certificates_test_key_directory }}/19443-bundle.pem"
      loop_control:
        loop_var: __certificates_test_link
        label: "{{ __certificates_test_link.path }}"
      register: __certificates_test_link_stats

    - name: CERTIFICATES | Verify service symlink targets
      ansible.builtin.assert:
        that:
          - __certificates_test_link_stat.stat.islnk
          - __certificates_test_link_stat.stat.lnk_source ==
            __certificates_test_link_stat.__certificates_test_link.target
      loop: "{{ __certificates_test_link_stats.results }}"
      loop_control:
        loop_var: __certificates_test_link_stat
        label: "{{ __certificates_test_link_stat.stat.path }}"

    - name: CERTIFICATES | Read the third deployed certificate
      community.crypto.x509_certificate_info:
        path: "{{ __certificates_test_certificate_directory }}/auxiliary.crt"
      register: __certificates_test_auxiliary

    - name: CERTIFICATES | Verify the third deployed certificate
      ansible.builtin.assert:
        that: __certificates_test_auxiliary.subject.commonName == inventory_hostname ~ '-web'

    - name: CERTIFICATES | Inspect the private directory
      become: true
      become_user: root
      ansible.builtin.stat:
        path: "{{ __certificates_test_key_directory }}"
      register: __certificates_test_private_directory

    - name: CERTIFICATES | Verify new and preserved private directory permissions
      ansible.builtin.assert:
        that:
          - __certificates_test_private_directory.stat.isdir
          - __certificates_test_private_directory.stat.uid == ((ansible_facts.os_family == 'RedHat') | ternary(0,
            65534))
          - __certificates_test_private_directory.stat.gid == ((ansible_facts.os_family == 'RedHat') | ternary(0,
            65534))
          - __certificates_test_private_directory.stat.mode == ((ansible_facts.os_family == 'RedHat') |
            ternary('0700', '0750'))
