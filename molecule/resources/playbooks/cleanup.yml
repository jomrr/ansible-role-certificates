---
# role: certificates
# file: molecule/resources/playbooks/cleanup.yml

- name: CERTIFICATES | Remove source fixtures
  hosts: all
  gather_facts: false
  tasks:
    - name: CERTIFICATES | Remove each consumer's source fixtures
      ansible.builtin.file:
        path: "{{ __certificates_test_source }}"
        state: absent
      delegate_to: "{{ __certificates_test_cleanup_source }}"
      loop: "{{ [certificates_source_host, groups['all'] | last] | unique }}"
      loop_control:
        loop_var: __certificates_test_cleanup_source
