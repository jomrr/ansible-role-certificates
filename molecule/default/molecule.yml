---
# role: certificates
# file: molecule/default/molecule.yml

dependency:
  name: "galaxy"
  options:
    role-file: "${MOLECULE_PROJECT_DIRECTORY}/collections.yml"
    requirements-file: "${MOLECULE_PROJECT_DIRECTORY}/collections.yml"
driver:
  name: "podman"
provisioner:
  name: "ansible"
  config_options:
    defaults:
      forks: 8
      interpreter_python: "auto_silent"
      callbacks_enabled: "ansible.posix.profile_tasks,ansible.posix.timer"
      callback_result_format: "yaml"
      allow_world_readable_tmpfiles: false
    connection:
      pipelining: true
  inventory:
    group_vars:
      all:
        ansible_podman_mount_detection: false
        __certificates_test_key_acl:
          - "user::rw-"
          - "user:26:r--"
          - "user:60026:r--"
          - "group::---"
          - "group:60027:r--"
          - "mask::r--"
          - "other::---"
        __certificates_test_source: "/tmp/certificates-issuer/{{ inventory_hostname }}"
        certificates_source_host: "{{ groups['all'] | first }}"
        certificates_source_become: true
        __certificates_test_certificate_directories:
          RedHat: "/etc/pki/tls/certs"
          Debian: "/etc/ssl/certs"
          Suse: "/etc/ssl/servercerts"
        __certificates_test_key_directories:
          RedHat: "/etc/pki/tls/private"
          Debian: "/etc/ssl/private"
          Suse: "/etc/ssl/private"
        __certificates_test_certificate_directory: "{{ __certificates_test_certificate_directories[ansible_facts.os_family]\
          \ }}"
        __certificates_test_key_directory: "{{ __certificates_test_key_directories[ansible_facts.os_family] }}"
        __certificates_test_web_certificate:
          name: "18443"
          certificate:
            src: "{{ __certificates_test_source }}/web.pem"
            acl:
              - "user::rw-"
              - "user:nobody:rw-"
              - "group::r--"
              - "other::r--"
          chain:
            src: "{{ __certificates_test_source }}/ca.pem"
            acl:
              - "user::rw-"
              - "group::r--"
              - "group:60027:rw-"
              - "other::r--"
          fullchain:
            src: "{{ __certificates_test_source }}/web-fullchain.pem"
            acl:
              - "user::rw-"
              - "user:60026:r--"
              - "group::r--"
              - "other::r--"
          private_key:
            src: "{{ __certificates_test_source }}/web.key"
            acl: "{{ __certificates_test_key_acl }}"
          links:
            - path: "/tmp/certificates-service/tls/50-site.crt"
              artifact: "fullchain"
            - path: "/tmp/certificates-service/tls/50-site.key"
              artifact: "private_key"
          notify:
            - "activate test web tls"
        __certificates_test_mail_certificate:
          name: "19443"
          certificate:
            src: "{{ __certificates_test_source }}/mail.pem"
            mode: "0640"
          private_key:
            src: "{{ __certificates_test_source }}/mail.key"
            owner: "nobody"
            mode: "0640"
          bundle:
            src: "{{ __certificates_test_source }}/mail-bundle.pem"
          links:
            - path: "/tmp/certificates-service/tls/proxy.pem"
              artifact: "bundle"
          notify:
            - "certificates_test_service : CERTIFICATES | Restart mail TLS"
        __certificates_test_replacement_certificate:
          name: "18443"
          certificate:
            src: "{{ __certificates_test_source }}/replacement.pem"
            acl:
              - "user::rw-"
              - "user:nobody:rw-"
              - "group::r--"
              - "other::r--"
          chain:
            src: "{{ __certificates_test_source }}/ca.pem"
            acl:
              - "user::rw-"
              - "group::r--"
              - "group:60027:rw-"
              - "other::r--"
          fullchain:
            src: "{{ __certificates_test_source }}/replacement-fullchain.pem"
            acl:
              - "user::rw-"
              - "user:60026:r--"
              - "group::r--"
              - "other::r--"
          private_key:
            src: "{{ __certificates_test_source }}/replacement.key"
            acl: "{{ __certificates_test_key_acl }}"
          links:
            - path: "/tmp/certificates-service/tls/50-site.crt"
              artifact: "fullchain"
            - path: "/tmp/certificates-service/tls/50-site.key"
              artifact: "private_key"
          notify:
            - "activate test web tls"
        __certificates_test_public_certificates:
          - name: "public-only"
            certificate:
              src: "{{ __certificates_test_source }}/mail.pem"
            notify: []
          - name: "additional-public"
            certificate:
              src: "{{ __certificates_test_source }}/web.pem"
            notify: []
        __certificates_test_auxiliary_certificate:
          name: "{{ ansible_check_mode | ternary('acl-preview', 'auxiliary') }}"
          certificate:
            src: "{{ __certificates_test_source }}/web.pem"
            acl:
              - "user::rw-"
              - "user:60026:r--"
              - "group::r--"
              - "other::r--"
          bundle:
            src: "{{ __certificates_test_source }}/web-bundle.pem"
            acl: "{{ __certificates_test_key_acl }}"
          notify: []
        certificates_certificates: |-
          {{ [__certificates_test_web_certificate, __certificates_test_mail_certificate,
            __certificates_test_auxiliary_certificate] }}
  log: true
  playbooks:
    prepare: "../resources/playbooks/prepare.yml"
    converge: "../resources/playbooks/converge.yml"
    verify: "../resources/playbooks/verify.yml"
    side_effect: "../resources/playbooks/side_effect.yml"
    cleanup: "../resources/playbooks/cleanup.yml"
verifier:
  name: "ansible"
scenario:
  test_sequence:
    - "dependency"
    - "destroy"
    - "syntax"
    - "create"
    - "prepare"
    - "converge"
    - "idempotence"
    - "check"
    - "verify"
    - "side_effect"
    - "cleanup"
    - "destroy"
  name: "default"
platforms:
  - name: "certificates"
    image: "docker.io/${uns:-jomrr}/molecule-${img:-fedora}:${tag:-latest}"
    pre_build_image: true
    override_command: false
    systemd: "true"
