---
# role: certificates
# file: tasks/install.yml

- name: CERTIFICATES | Install POSIX ACL utilities when requested
  become: true
  become_user: root
  ansible.builtin.package:
    name: acl
    state: present
  when: __certificates_artifacts | selectattr('value.acl', 'defined') | list | length > 0

- name: CERTIFICATES | Install all checked artifacts
  become: true
  become_user: root
  jomrr.general.write_files:
    files: "{{ __certificates_files }}"
  register: __certificates_written
  no_log: true
  diff: false

- name: CERTIFICATES | Link and activate each certificate
  ansible.builtin.include_tasks: activate.yml
  loop: "{{ certificates_certificates }}"
  loop_control:
    loop_var: __certificates_certificate
    label: "{{ __certificates_certificate.name }}"
