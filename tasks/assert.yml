---
# role: certificates
# file: tasks/assert.yml

- name: CERTIFICATES | Validate candidate public certificates
  ansible.builtin.assert:
    that:
      - (__certificates_source.content | b64decode | community.crypto.x509_certificate_info).public_key | length > 0
    quiet: true
  loop: "{{ __certificates_public_sources.results }}"
  loop_control:
    loop_var: __certificates_source
    label: "{{ __certificates_source.__certificates_artifact.value.src }}"

- name: CERTIFICATES | Match fullchain to certificate
  ansible.builtin.assert:
    that:
      - >-
        ((__certificates_public_sources.results
          | selectattr('__certificates_artifact.key', 'equalto', 'certificate') | first).content
          | b64decode | community.crypto.x509_certificate_info).fingerprints.sha256
        == ((__certificates_public_sources.results
          | selectattr('__certificates_artifact.key', 'equalto', 'fullchain') | first).content
          | b64decode | community.crypto.x509_certificate_info).fingerprints.sha256
    fail_msg: "Fullchain does not start with the certificate for {{ certificates_certificates[__certificates_index].name }}."
    quiet: true
  when: certificates_certificates[__certificates_index].fullchain is defined

- name: CERTIFICATES | Match certificate to private key
  ansible.builtin.assert:
    that:
      - >-
        ((__certificates_public_sources.results
          | selectattr('__certificates_artifact.key', 'equalto', 'certificate') | first).content
          | b64decode | community.crypto.x509_certificate_info).public_key
        == (__certificates_private_key_source.content | b64decode | community.crypto.openssl_privatekey_info).public_key
    fail_msg: "Certificate and private key do not match for {{ certificates_certificates[__certificates_index].name }}."
    quiet: true
  when: certificates_certificates[__certificates_index].private_key is defined
  no_log: true
