---
# role: certificates
# file: tasks/main.yml

- name: CERTIFICATES | Validate certificate filename stems
  ansible.builtin.assert:
    that:
      - >-
        certificates_certificates | map(attribute='name') | unique(case_sensitive=true) | length
        == certificates_certificates | length
      - >-
        certificates_certificates | map(attribute='name')
        | select('match', '^[A-Za-z0-9][A-Za-z0-9_.-]*$') | list | length
        == certificates_certificates | length
    fail_msg: Certificate names must be unique filename stems using ASCII letters, digits, dots, underscores or hyphens.
    quiet: true

- name: CERTIFICATES | Load platform settings
  ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', __certificates_platform_files) }}"
  vars:
    __certificates_platform_files:
      files:
        - "{{ ansible_facts.os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"

- name: CERTIFICATES | Ensure the server certificate directory
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ __certificates_certificate_directory }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
    setype: _default

- name: CERTIFICATES | Read existing private directory permissions
  become: true
  become_user: root
  ansible.builtin.stat:
    path: "{{ __certificates_private_key_directory }}"
    follow: true
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: __certificates_private_directory

- name: CERTIFICATES | Ensure the private key directory
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ __certificates_private_key_directory }}"
    state: directory
    owner: "{{ __certificates_private_directory.stat.uid | default('root') }}"
    group: "{{ __certificates_private_directory.stat.gid | default('root') }}"
    mode: "{{ __certificates_private_directory.stat.mode | default('0700') }}"
    setype: _default

# Shared indices keep host-specific certificate data out of include grouping.
- name: CERTIFICATES | Distribute certificate deployments
  ansible.builtin.include_tasks: certificate.yml
  loop: "{{ range(certificates_certificates | length) | list }}"
  loop_control:
    loop_var: __certificates_index
    label: "{{ __certificates_index }}"
