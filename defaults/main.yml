---
# role: certificates
# file: defaults/main.yml

# Inventory host holding all source artifacts for this role invocation; required.
# certificates_source_host: pki01

# Read source artifacts as root; disable when the source account can read them.
certificates_source_become: true

# Certificate deployments assigned to this consumer; an empty list preserves files.
certificates_certificates: []
# Each entry requires name, certificate and notify. Optional chain, fullchain and
# private_key belong to that certificate. All src paths are absolute paths on
# certificates_source_host; there are no per-certificate source host overrides.
#
# Names are filename stems containing ASCII letters, digits, dots, underscores
# or hyphens, starting with a letter or digit. Platform TLS directories contain:
#   certificate: <name>.crt          private_key: <name>.key
#   chain: <name>-chain.pem          fullchain: <name>-fullchain.pem
# Private keys must be unencrypted and match their certificate.
#
# Each artifact accepts src, optional owner/group and either mode or acl.
# acl is a complete list of setfacl access entries passed unchanged to write_files;
# unlisted entries are removed. An omitted mask is calculated by setfacl.
# Numeric IDs need no local account. Without acl, the mode defaults below apply.
#
# Optional links contains path/artifact pairs; parent service directories must exist.
# Choices for link artifact: certificate, chain, fullchain, private_key.
# notify lists handler names or listen topics shared by this certificate's artifacts
# and links. An empty list requests installation without service activation.
# certificates_certificates:
#   - name: web01
#     certificate:
#       src: /srv/tls/web01.pem
#     fullchain:
#       src: /srv/tls/web01-fullchain.pem
#     private_key:
#       src: /srv/tls/web01.key
#       acl:
#         - user::rw-
#         - user:26:r--
#         - group::---
#         - other::---
#     links:
#       - path: /etc/cockpit/ws-certs.d/50-site.crt
#         artifact: fullchain
#       - path: /etc/cockpit/ws-certs.d/50-site.key
#         artifact: private_key
#     notify: [activate web tls]

# Default file owner; each artifact may override it with owner.
certificates_owner: root

# Default file group; each artifact may override it with group.
certificates_group: root

# Default public artifact mode when acl is omitted; overridable with mode.
certificates_certificate_mode: '0644'

# Default private key mode when acl is omitted; overridable with mode.
certificates_private_key_mode: '0600'
