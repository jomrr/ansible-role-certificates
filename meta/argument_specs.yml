---
# role: certificates
# file: meta/argument_specs.yml

argument_specs:
  main:
    short_description: Install existing PEM certificates and matching private keys on
      consumer hosts.
    options:
      certificates_certificates:
        type: list
        elements: dict
        default: []
        options:
          name:
            type: str
            required: true
            description: Unique filename stem for this certificate and its associated artifacts.
          certificate:
            type: dict
            options:
              src:
                type: path
                required: true
                description: Absolute artifact file path on the source host.
              owner:
                type: str
                description: File owner; defaults to certificates_owner.
              group:
                type: str
                description: File group; defaults to certificates_group.
              mode:
                type: str
                description: File mode; without acl, defaults to certificates_private_key_mode
                  for keys and bundles or certificates_certificate_mode otherwise.
              acl:
                type: list
                elements: str
                description: Complete POSIX access ACL passed unchanged to write_files;
                  mutually exclusive with mode.
            description: Required leaf certificate.
            required: true
          chain:
            type: dict
            options:
              src:
                type: path
                required: true
                description: Absolute artifact file path on the source host.
              owner:
                type: str
                description: File owner; defaults to certificates_owner.
              group:
                type: str
                description: File group; defaults to certificates_group.
              mode:
                type: str
                description: File mode; without acl, defaults to certificates_private_key_mode
                  for keys and bundles or certificates_certificate_mode otherwise.
              acl:
                type: list
                elements: str
                description: Complete POSIX access ACL passed unchanged to write_files;
                  mutually exclusive with mode.
            description: Optional issuer chain.
          fullchain:
            type: dict
            options:
              src:
                type: path
                required: true
                description: Absolute artifact file path on the source host.
              owner:
                type: str
                description: File owner; defaults to certificates_owner.
              group:
                type: str
                description: File group; defaults to certificates_group.
              mode:
                type: str
                description: File mode; without acl, defaults to certificates_private_key_mode
                  for keys and bundles or certificates_certificate_mode otherwise.
              acl:
                type: list
                elements: str
                description: Complete POSIX access ACL passed unchanged to write_files;
                  mutually exclusive with mode.
            description: Optional fullchain starting with the leaf certificate.
          private_key:
            type: dict
            options:
              src:
                type: path
                required: true
                description: Absolute artifact file path on the source host.
              owner:
                type: str
                description: File owner; defaults to certificates_owner.
              group:
                type: str
                description: File group; defaults to certificates_group.
              mode:
                type: str
                description: File mode; without acl, defaults to certificates_private_key_mode
                  for keys and bundles or certificates_certificate_mode otherwise.
              acl:
                type: list
                elements: str
                description: Complete POSIX access ACL passed unchanged to write_files;
                  mutually exclusive with mode.
            description: Optional unencrypted private key matching the leaf certificate.
          bundle:
            type: dict
            options:
              src:
                type: path
                required: true
                description: Absolute artifact file path on the source host.
              owner:
                type: str
                description: File owner; defaults to certificates_owner.
              group:
                type: str
                description: File group; defaults to certificates_group.
              mode:
                type: str
                description: File mode; without acl, defaults to certificates_private_key_mode
                  for keys and bundles or certificates_certificate_mode otherwise.
              acl:
                type: list
                elements: str
                description: Complete POSIX access ACL passed unchanged to write_files;
                  mutually exclusive with mode.
            description: Optional PEM containing the leaf certificate, any intermediates
              and its matching unencrypted private key.
          links:
            type: list
            elements: dict
            options:
              path:
                type: path
                required: true
                description: Absolute symlink path; its parent service directory must exist.
              artifact:
                type: str
                required: true
                choices:
                  - certificate
                  - chain
                  - fullchain
                  - private_key
                  - bundle
                description: Declared artifact to expose through this link.
            description: Optional service symlinks to artifacts of this certificate.
          notify:
            type: list
            elements: str
            required: true
            description: Handler names or listen topics for changes to this certificate,
              its artifacts or links. An empty list disables notifications.
        description: Certificate deployments with their directly associated artifacts and
          service handlers.
      certificates_owner:
        type: str
        default: root
        description: Default file owner, overridable separately on each artifact.
      certificates_group:
        type: str
        default: root
        description: Default file group, overridable separately on each artifact.
      certificates_certificate_mode:
        type: str
        default: '0644'
        description: Default certificate mode for managed resources; modes must be quoted
          octal strings.
      certificates_private_key_mode:
        type: str
        default: '0600'
        description: Default mode for private keys and bundles; modes must be quoted octal
          strings.
      certificates_source_host:
        type: str
        required: true
        description: Inventory host holding all source artifacts for this role invocation.
          Per-entry overrides are not supported.
      certificates_source_become:
        type: bool
        default: true
        description: Read source files as root. Disable when the source connection account
          can read all required artifacts.
