---
# role: certificates
# file: vars/main.yml

__certificates_suffixes:
  certificate: .crt
  chain: -chain.pem
  fullchain: -fullchain.pem
  private_key: .key

# Native key/value entries preserve the artifact type for batch operations.
__certificates_artifacts: >-
  {{ certificates_certificates | map('dict2items') | flatten
    | selectattr('key', 'in', __certificates_suffixes) | list }}

__certificates_link_paths: >-
  {{ certificates_certificates | map(attribute='links', default=[]) | flatten
    | map(attribute='path') | map('normpath') | list }}

# The current certificate's paths are shared by links and change notifications.
__certificates_destinations:
  certificate: "{{ __certificates_certificate_directory }}/{{ __certificates_certificate.name }}.crt"
  chain: "{{ __certificates_certificate_directory }}/{{ __certificates_certificate.name }}-chain.pem"
  fullchain: "{{ __certificates_certificate_directory }}/{{ __certificates_certificate.name }}-fullchain.pem"
  private_key: "{{ __certificates_private_key_directory }}/{{ __certificates_certificate.name }}.key"

# Join the checked source bytes and file attributes for one write_files call.
__certificates_files: >-
  {%- set files = [] -%}
  {%- for certificate in certificates_certificates -%}
  {%- for kind, artifact in certificate.items() if kind in __certificates_suffixes -%}
  {%- set private = kind == 'private_key' -%}
  {%- set _ = files.append({
    'path': (__certificates_private_key_directory if private else __certificates_certificate_directory)
      ~ '/' ~ certificate.name ~ __certificates_suffixes[kind],
    'content': __certificates_source.content[artifact.src | normpath],
    'owner': artifact.owner | default(certificates_owner),
    'group': artifact.group | default(certificates_group),
    'mode': artifact.mode | default(omit if artifact.acl is defined
      else certificates_private_key_mode if private else certificates_certificate_mode),
    'acl': artifact.acl | default(omit)
  }) -%}
  {%- endfor -%}
  {%- endfor -%}
  {{ files }}
